<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06070B">
  <title>CStream — Video On Demand</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06070B; --bg-elevated: #10121A; --surface: #181B26; --surface-light: #222635;
      --line: rgba(255,255,255,0.06); --line-strong: rgba(255,255,255,0.12); --text: #FFFFFF;
      --muted: #8F95AA; --accent: #00f3ff; --accent-strong: #7ccfff; --accent-bg: rgba(0, 243, 255, 0.12);
      --accent-magenta: #ff0055; --shadow-soft: 0 8px 30px rgba(0,0,0,0.4); --shadow-glow: 0 15px 40px rgba(0, 243, 255, 0.15);
      --ease: cubic-bezier(0.25, 1, 0.35, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100vw; min-height: 100vh; background: var(--bg); overflow-x: hidden; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); background-image: radial-gradient(circle at 100% 0%, rgba(0, 243, 255, 0.06) 0%, transparent 40%), radial-gradient(circle at 0% 100%, rgba(255, 0, 85, 0.04) 0%, transparent 40%); background-attachment: fixed; }
    button, input { font: inherit; outline: none; border: 0; background: transparent; }
    button { cursor: pointer; }

    /* SPLASH SCREEN & LOADER */
    #splash-screen { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity 0.6s var(--ease), visibility 0.6s var(--ease); }
    .splash-brand { display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 800; font-family: 'Orbitron', sans-serif; }
    .splash-pill { width: 12px; height: 32px; border-radius: 99px; background: var(--accent); box-shadow: var(--shadow-glow); }
    .splash-brand span span { color: var(--accent); }
    .loading-text { margin-top: 15px; font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* TOPBAR */
    .topbar { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 20px 12px; background: rgba(6, 7, 11, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .brand-name { font-size: 18px; font-weight: 900; font-family: 'Orbitron', sans-serif; text-transform: uppercase; color: var(--text); letter-spacing: -0.5px; }
    .brand-name span { color: var(--accent); }
    .search-wrap { flex-grow: 1; position: relative; }
    .search-bar-header { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 99px; transition: all 0.3s; }
    .search-bar-header:focus-within { border-color: var(--accent); background: var(--surface); }
    .search-bar-header input { width: 100%; color: var(--text); font-size: 13px; font-weight: 500; }
    .top-action-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; flex-shrink: 0; }
    .top-action-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* HERO BANNER */
    .hero-carousel { position: relative; width: 100%; height: 55vh; min-height: 400px; max-height: 550px; overflow: hidden; background: #000; }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s var(--ease); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 40px 20px; text-align: center; }
    .hero-slide.active { opacity: 1; z-index: 2; }
    .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .hero-overlay { position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, var(--bg) 0%, rgba(6,7,11,0.6) 40%, rgba(6,7,11,0.1) 100%); }
    .hero-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; line-height: 1.1; margin-bottom: 8px; text-transform: uppercase; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
    .hero-meta { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.75rem; color: #ddd; margin-bottom: 18px; font-weight: 600; }
    .hero-play-btn { background: var(--accent-magenta); color: #fff; padding: 12px 35px; border-radius: 99px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(255,0,85,0.4); }
    .hero-dots { display: flex; justify-content: center; gap: 6px; margin-top: 15px; z-index: 10; position: relative; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; }
    .hero-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }

    /* SECTION HORIZONTAL CAROUSEL */
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 20px 15px; border-left: 4px solid var(--accent); padding-left: 10px; }
    .section-head-title { display: flex; align-items: center; gap: 8px; cursor: pointer; position: relative; }
    .section-head h2 { font-size: 16px; font-weight: 700; font-family: 'Orbitron', sans-serif; }
    .carousel-h { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .carousel-h::-webkit-scrollbar { display: none; }
    
    .media-card { min-width: 130px; width: 130px; aspect-ratio: 2 / 3; background: var(--surface); border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid var(--line); scroll-snap-align: start; flex-shrink: 0; }
    .media-card img { width: 100%; height: 100%; object-fit: cover; }
    .quality-badge { position: absolute; top: 6px; right: 6px; background: var(--accent); color: #000; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; font-family: 'Orbitron', sans-serif; }
    .rating-badge { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 3px; z-index: 2; }
    .rating-badge svg { width: 10px; height: 10px; fill: #f39c12; }
    .type-badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .rank-badge { position: absolute; top: 6px; left: 6px; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); line-height: 1; z-index:2; }
    .media-title-wrap { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%); padding: 25px 8px 10px; text-align: left; }
    .media-title-wrap h4 { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

    /* VIEWS */
    .view { display: none; animation: fadeIn 0.3s; width: 100%; padding-bottom: 30px; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* DETAIL VIEW */
    #detail-view { padding-top: 0; }
    .back-btn-detail { position: fixed; top: max(15px, env(safe-area-inset-top)); left: 15px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid var(--line-strong); color: #fff; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; font-size: 18px; }
    .detail-hero-wrapper { position: relative; width: 100%; height: 60vh; min-height: 450px; background: #000; display: flex; justify-content: center; align-items: center; }
    .detail-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    .detail-hero-gradient { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(6,7,11,0.8) 30%, transparent 100%); }
    .detail-hero-play-btn { position: relative; z-index: 15; width: 65px; height: 65px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.3); display: none; align-items: center; justify-content: center; cursor: pointer; }
    .detail-hero-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; text-align: center; z-index: 10; }
    .detail-hero-title { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; line-height: 1.1; margin-bottom: 8px; }
    .detail-hero-genres { font-size: 0.8rem; color: #ddd; font-weight: 500; }
    
    .detail-player-wrapper { width: 100%; background: #000; position: sticky; top: 0; z-index: 90; border-bottom: 1px solid var(--line); }
    #cstream-iframe { width: 100%; aspect-ratio: 16/9; background: #000; border: none; display: block; }
    
    .detail-body { padding: 15px 20px; }
    .detail-specs-text { font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-quality { background: #27ae60; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; font-family: 'Orbitron', sans-serif; }
    .synopsis-text { font-size: 0.85rem; color: #bbb; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="splash-brand"><span class="splash-pill"></span>CSTREAM</div>
    <div class="loading-text">Menghubungkan ke Server...</div>
  </div>

  <!-- TOP HEADER -->
  <header id="main-header" class="topbar">
    <div class="brand" onclick="switchView('home')">
      <span class="brand-name">C<span>Stream</span></span>
    </div>
    <div class="search-wrap">
      <div class="search-bar-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Cari judul...">
      </div>
    </div>
    <button class="top-action-btn" id="profileBtn" onclick="alert('Menu Profil & Riwayat')">
        <img id="navAvatar" src="logouniverse.svg" alt="Profil">
    </button>
  </header>

  <!-- HOME VIEW -->
  <div id="home-view" class="view active">
    
    <!-- Hero Banner -->
    <div id="hero-banner" class="hero-carousel">
        <div id="hero-slides-container"></div>
        <div class="hero-dots" id="hero-dots-container"></div>
    </div>
    
    <!-- LAGI TREN -->
    <div class="section">
      <div class="section-head"><h2>Lagi Tren Sekarang</h2></div>
      <div class="carousel-h" id="trending-carousel"></div>
    </div>

    <!-- KOREAN DRAMA / SERIES -->
    <div class="section">
      <div class="section-head">
          <div class="section-head-title"><h2 style="color: var(--accent-magenta);">Korean Drama</h2></div>
          <span style="font-size: 11px; color: var(--muted);">Lihat semua ></span>
      </div>
      <div class="carousel-h" id="category-carousel"></div>
    </div>

    <!-- FILM TERBARU -->
    <div class="section">
      <div class="section-head">
          <h2>Film Terbaru</h2>
          <span style="font-size: 11px; color: var(--muted);">Lihat semua ></span>
      </div>
      <div class="carousel-h" id="latest-movie-carousel"></div>
    </div>

  </div>

  <!-- DETAIL & PLAYER VIEW (DUAL STATE) -->
  <div id="detail-view" class="view">
    <button class="back-btn-detail" onclick="switchView('home')">←</button>
    
    <!-- STATE 1: COVER INFO -->
    <div id="detail-state-info">
        <div class="detail-hero-wrapper">
            <img id="detail-hero-img" src="" class="detail-hero-img">
            <div class="detail-hero-gradient"></div>
            <!-- Tombol Play khusus Movie -->
            <div id="detail-hero-play-btn" class="detail-hero-play-btn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff" style="margin-left:4px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <div class="detail-hero-content">
                <h1 id="detail-hero-title" class="detail-hero-title">Memuat...</h1>
                <div id="detail-hero-genres" class="detail-hero-genres">Action · Drama</div>
            </div>
        </div>
    </div>

    <!-- STATE 2: PLAYER -->
    <div id="detail-state-player" style="display: none;">
        <div class="detail-player-wrapper">
            <!-- Iframe akan diload di sini saat Play ditekan, 
                 Nanti diganti dengan stream.html lu pas scraper HLS udah jalan -->
            <iframe id="cstream-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- SHARED DETAIL BODY -->
    <div class="detail-body">
        <div id="player-active-meta" style="display: none; margin-bottom: 15px;">
            <h1 id="player-show-title" style="font-family:'Orbitron', sans-serif; font-size:1.4rem; font-weight:800;">Judul</h1>
            <h2 id="player-ep-title" style="font-size:1rem; color:var(--accent); font-weight:700; margin-bottom:5px;">Episode 1</h2>
        </div>
        
        <div id="detail-specs" class="detail-specs-text"></div>
        <div id="detail-synopsis" class="synopsis-text">Deskripsi lengkap akan dimuat saat scrape detail berjalan...</div>
    </div>
  </div>

  <!-- JAVASCRIPT UTAMA -->
  <script>
    // URL API Backend lu (Ganti ke Railway lu kalau udah jalan)
    const BACKEND_URL = "https://cstreamnew-production.up.railway.app"; 
    
    let heroSlideIndex = 0; let heroAutoPlay;
    let allFetchedData = []; // Buat nyimpen array sementara untuk buka detail
    let currentMediaData = null;

    function hideSplashScreen() {
      const s = document.getElementById('splash-screen');
      s.style.opacity = '0'; setTimeout(() => s.style.display = 'none', 600);
    }

    // FUNGSI UTAMA: MENGAMBIL DATA DARI BACKEND RAILWAY
    async function loadHomeContent() {
        try {
            // Nembak ke endpoint Python Flask
            const response = await fetch(`${BACKEND_URL}/api/home`);
            const data = await response.json();
            
            if(data.error) throw new Error(data.error);

            // Gabungkan semua data buat pencarian ID pas klik detail
            allFetchedData = [...data.hero, ...data.trending, ...data.kdrama, ...data.movies];

            // Render ke UI
            renderHeroBanner(data.hero);
            renderCarouselH('trending-carousel', data.trending, true, false); // true = show Rank
            renderCarouselH('category-carousel', data.kdrama, false, false);
            renderCarouselH('latest-movie-carousel', data.movies, false, true); // true = show Type Badge (MOVIE)
            
            hideSplashScreen(); 
        } catch (err) {
            console.error("Gagal load dari server:", err);
            document.querySelector('.loading-text').innerText = "Gagal memuat API. Server offline.";
            document.querySelector('.loading-text').style.color = "var(--accent-magenta)";
        }
    }

    // RENDER HERO BANNER
    function renderHeroBanner(topMovies) {
        if(!topMovies || topMovies.length === 0) return;
        const container = document.getElementById('hero-slides-container');
        const dotsContainer = document.getElementById('hero-dots-container');
        
        container.innerHTML = topMovies.map((m, i) => `
            <div class="hero-slide ${i === 0 ? 'active' : ''}" id="slide-${i}">
                <img class="hero-bg" src="${m.cover}" alt="bg">
                <div class="hero-overlay"></div>
                <h2 class="hero-title">${m.title}</h2>
                <div class="hero-meta"><span style="color:#f39c12">★ ${m.rating}</span> • <span>${m.specs}</span></div>
                <div class="hero-play-btn" onclick="openDetail('${encodeURIComponent(m.id)}')">▶ Tonton</div>
            </div>
        `).join('');

        dotsContainer.innerHTML = topMovies.map((_, i) => `<div class="hero-dot ${i === 0 ? 'active' : ''}" onclick="changeHeroSlide(${i})"></div>`).join('');

        clearInterval(heroAutoPlay);
        heroAutoPlay = setInterval(() => { changeHeroSlide((heroSlideIndex + 1) % topMovies.length); }, 4000);
    }

    function changeHeroSlide(index) {
        heroSlideIndex = index;
        document.querySelectorAll('.hero-slide').forEach((s, i) => s.classList.toggle('active', i === index));
        document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === index));
    }

    // RENDER CARD HORIZONTAL (Fungsi Universal)
    function renderCarouselH(containerId, items, showRank = false, showTypeBadge = false) {
      if(!items || items.length === 0) return;
      document.getElementById(containerId).innerHTML = items.map((item, index) => {
          let rankHTML = showRank ? `<div class="rank-badge">${index + 1}</div>` : '';
          let typeHTML = showTypeBadge ? `<div class="type-badge">${item.type}</div>` : '';
          
          return `
            <div class="media-card" onclick="openDetail('${encodeURIComponent(item.id)}')">
              ${rankHTML}
              ${typeHTML}
              <div class="rating-badge"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>${item.rating}</div>
              <div class="quality-badge">${item.quality}</div>
              <img src="${item.cover}" onerror="this.src='logouniverse.svg'">
              <div class="media-title-wrap"><h4>${item.title}</h4></div>
            </div>
          `;
      }).join('');
    }

    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewName + '-view').classList.add('active');
      document.getElementById('cstream-iframe').src = '';
      window.scrollTo(0, 0);
    }

    // BUKA HALAMAN DETAIL
    window.openDetail = function(encodedId) {
      const mediaId = decodeURIComponent(encodedId);
      const data = allFetchedData.find(m => m.id === mediaId) || allFetchedData[0];
      if(!data) return;
      currentMediaData = data;
      
      switchView('detail');

      // Tampilkan Info, Sembunyikan Player
      document.getElementById('detail-state-info').style.display = 'block';
      document.getElementById('detail-state-player').style.display = 'none';
      document.getElementById('player-active-meta').style.display = 'none';

      // Set Info Data
      document.getElementById('detail-hero-img').src = data.cover;
      document.getElementById('detail-hero-title').innerText = data.title;
      document.getElementById('detail-hero-genres').innerText = data.genre;
      
      document.getElementById('detail-specs').innerHTML = `<span class="badge-quality">${data.quality}</span> <span style="color:#f39c12; font-weight:700;">★ ${data.rating}</span> · ${data.specs}`;
      document.getElementById('detail-synopsis').innerText = data.synopsis;

      // PENGKONDISIAN MOVIE (Buka Tombol Play) vs SERIES
      const playBtn = document.getElementById('detail-hero-play-btn');

      if (data.type === 'movie') {
          playBtn.style.display = 'flex';
          playBtn.onclick = () => playMovie();
      } else {
          // Kalau Series, di versi ini belum ada daftar episode (karena belum fetch detail)
          // Kita kasih tombol play sementara di cover biar user tetap bisa nge-klik
          playBtn.style.display = 'flex';
          playBtn.onclick = () => playMovie();
      }
    };

    // PLAY VIDEO (Trigger saat tombol play ditekan)
    window.playMovie = function() {
        if (!currentMediaData) return;
        document.getElementById('detail-state-info').style.display = 'none';
        document.getElementById('detail-state-player').style.display = 'block';
        document.getElementById('player-active-meta').style.display = 'block';
        
        document.getElementById('player-show-title').innerText = currentMediaData.title;
        document.getElementById('player-ep-title').innerText = currentMediaData.specs;
        
        // Disini nanti diganti URL Iframe Player lu
        document.getElementById('cstream-iframe').src = currentMediaData.vidUrl || "https://example.com";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Jalankan pas Web dibuka
    window.onload = () => { loadHomeContent(); };
  </script>
</body>
</html>
